# Payment webhooks and PHP. Installed by CD as /etc/nginx/snippets/yourcast-php.conf
# (deploy/ensure_nginx_php.py puts its include where the site had `location ~ \.php$`).
#
# PHP on this server is 7.4 (Ubuntu 20.04), open to PHP2Shell (CVE-2026-109618/109619,
# 2026-10): one request runs code before any check in a script. No request reaches PHP:
# the payment webhooks are served by the admin process (app/admin_web/webhooks.py) at
# the paths the PHP listeners had, so Robokassa's and CryptoBot's settings stay.

# the site folder is a git checkout: never serve .git or other dotfiles (certbot keeps its own)
location ^~ /.well-known/acme-challenge/ { }
location ~ /\. { deny all; }
location = /yourcast_nginx { return 404; }

# Robokassa sends the payer back here: a redirect to the bot
location = /payment/robokassa/success.php { return 302 https://t.me/yourcastbot; }
location = /payment/robokassa/fail.php { return 302 https://t.me/yourcastbot; }

# Robokassa Result URL: only from the addresses Robokassa documents
location = /payment/robokassa/result.php {
    allow 185.59.216.65;
    allow 185.59.217.65;
    deny all;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
}

# Crypto Pay webhook (signed; scripts/payment/cryptoBot.py checks it)
location = /payment/crypto-bot/listener.php {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    client_max_body_size 1m;
}

location ~ \.php$ { return 404; }
