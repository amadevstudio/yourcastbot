# This is a basic workflow to help you get started with Actions

name: Continous deployment

# Controls when the workflow will run
on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  deploy-build-restart:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Push to production server and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            cd "${{ secrets.PROJECT_PATH }}"
            git fetch origin
            git reset --hard origin/main

            python3 -V
            if [ ! -d venv ]; then python3 -m venv venv; fi
            source venv/bin/activate
            python -m pip install -r requirements.txt

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            cd "${{ secrets.PROJECT_PATH }}/admin/web"
            npm ci
            npm run build
            cd "${{ secrets.PROJECT_PATH }}"

            mkdir -p /etc/nginx/snippets
            cp deploy/nginx-yourcast-admin.conf /etc/nginx/snippets/yourcast-admin.conf
            python3 deploy/ensure_nginx_admin.py
            nginx -t
            systemctl reload nginx

            cat supervisor.conf > /etc/supervisor/conf.d/yourcast.conf
            supervisorctl reread
            supervisorctl update

            cd /home/yourcast
            supervisorctl restart yourcast
