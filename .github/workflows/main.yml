# This is a basic workflow to help you get started with Actions

name: Continous deployment

# Controls when the workflow will run
on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: [ main ]

  # The guards run on a pull request before it merges; only a push to main
  # (or a manual run) deploys.
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # Shop cleanups have already shipped without change-plan. These scripts
  # do not need telebot or prod secrets; they must pass before CD.
  storefront-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stub gitignored constants
        run: |
          cp .claude/templates/constants.example.py constants.py
          cp .claude/templates/constant_texts.example.py constant_texts.py
      - name: HTTP client for the loopback download tests
        run: python3 -m pip install requests
      - name: Storefront and copy guards
        run: |
          python3 app/service/payment/test_storefront.py
          python3 app/service/payment/test_referral_award.py
          python3 app/service/payment/test_paywall.py
          python3 app/service/payment/test_stars_invoice.py
          python3 app/i18n/test_relay_copy.py
          python3 app/i18n/test_routed_fallback.py
          python3 app/jobs/test_circle_health.py
          python3 app/jobs/test_relay_remind.py
          python3 app/jobs/test_winback.py
          python3 app/jobs/test_tariff_tick.py
          python3 app/service/record/test_caption.py
          python3 lib/telegram/test_rich_message.py
          python3 app/service/record/test_delivery.py
          python3 app/service/podcast/test_card.py
          python3 app/service/podcast/test_feed_cache.py
          python3 app/service/podcast/test_cover.py
          python3 app/controller/builders/test_open_recs.py
          python3 app/controller/builders/test_screen_state.py
          python3 app/controller/builders/test_settings_screens.py
          python3 app/core/navigation/test_go_back.py
          python3 lib/requests/test_url.py
          python3 lib/requests/test_download_resume.py
          python3 lib/tools/test_logger_place.py
          python3 lib/tools/test_runtime_logging.py
          python3 db/test_feed_recovery.py
          python3 db/test_channel_poll.py
          python3 db/test_listening.py
          python3 app/jobs/test_digest_episodes.py
          python3 lib/net/test_enclosure.py
          python3 app/jobs/test_feed_health.py
          python3 app/repository/storage/test_sqlite_storage.py
          python3 lib/telegram/general/test_errors.py
          python3 lib/telegram/general/test_render_retry.py
          python3 lib/system/test_disk_budget.py
          python3 scripts/test_db_snapshot.py
          python3 db/test_usage.py
          python3 app/admin_web/test_economics.py
          python3 app/service/record/test_free_limit.py
          python3 app/controller/builders/test_onboarding.py
          python3 app/service/ai/test_summary.py
          python3 app/core/sender/test_record_delivery.py
          python3 db/test_send_outbox.py
          python3 app/core/sender/test_circle_charge.py
          python3 db/test_mark_sub_seen.py
          python3 db/test_episode_format.py
          python3 db/test_tariff_rows.py
          python3 app/core/balancers/test_record_balancer.py
          python3 app/admin_web/test_diag.py
          python3 app/service/podcast/test_feed_xml.py
          python3 app/jobs/test_quiet_start.py
          python3 app/jobs/test_nosub_rule.py
          python3 app/jobs/test_updater_resume.py
          python3 app/jobs/test_circle_pace.py
          python3 app/i18n/test_translations_complete.py

  deploy-build-restart:
    needs: storefront-guards
    if: github.event_name != 'pull_request'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # checkout@v5 runs on Node 24. v4 still targets Node 20, which GitHub
      # now warns about and will drop from hosted runners.
      - uses: actions/checkout@v5

      - name: Push to production server and restart
        # Pin the tag: @master dropped script_stop and would keep surprising us.
        # Stop-on-error is set -euo pipefail in the remote script instead.
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          # Key, not password: password login for root is to be switched off.
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            cd "${{ secrets.PROJECT_PATH }}"
            git fetch origin
            git reset --hard origin/main

            python3 -V
            if [ ! -d venv ]; then python3 -m venv venv; fi
            source venv/bin/activate
            python -m pip install -r requirements.txt

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            cd "${{ secrets.PROJECT_PATH }}/admin/web"
            npm ci
            npm run build
            cd "${{ secrets.PROJECT_PATH }}"

            mkdir -p /etc/nginx/snippets
            cp deploy/nginx-yourcast-admin.conf /etc/nginx/snippets/yourcast-admin.conf
            python3 deploy/ensure_nginx_admin.py
            python3 deploy/install_payment_php.py
            nginx -t
            systemctl reload nginx

            cat supervisor.conf > /etc/supervisor/conf.d/yourcast.conf
            supervisorctl reread
            supervisorctl update

            cd /home/yourcast
            supervisorctl restart yourcast
