# This is a basic workflow to help you get started with Actions

name: Continous deployment

# Controls when the workflow will run
on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # Shop cleanups have already shipped without change-plan. These scripts
  # do not need telebot or prod secrets; they must pass before CD.
  storefront-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stub gitignored constants
        run: |
          cp .claude/templates/constants.example.py constants.py
          cp .claude/templates/constant_texts.example.py constant_texts.py
      - name: Storefront and copy guards
        run: |
          python3 app/service/payment/test_storefront.py
          python3 app/i18n/test_relay_copy.py
          python3 app/jobs/test_circle_health.py
          python3 app/jobs/test_relay_remind.py

  deploy-build-restart:
    needs: storefront-guards
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # checkout@v5 runs on Node 24. v4 still targets Node 20, which GitHub
      # now warns about and will drop from hosted runners.
      - uses: actions/checkout@v5

      - name: Push to production server and restart
        # Pin the tag: @master dropped script_stop and would keep surprising us.
        # Stop-on-error is set -euo pipefail in the remote script instead.
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            cd "${{ secrets.PROJECT_PATH }}"
            git fetch origin
            git reset --hard origin/main

            python3 -V
            if [ ! -d venv ]; then python3 -m venv venv; fi
            source venv/bin/activate
            python -m pip install -r requirements.txt

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            cd "${{ secrets.PROJECT_PATH }}/admin/web"
            npm ci
            npm run build
            cd "${{ secrets.PROJECT_PATH }}"

            mkdir -p /etc/nginx/snippets
            cp deploy/nginx-yourcast-admin.conf /etc/nginx/snippets/yourcast-admin.conf
            python3 deploy/ensure_nginx_admin.py
            python3 deploy/install_payment_php.py
            nginx -t
            systemctl reload nginx

            cat supervisor.conf > /etc/supervisor/conf.d/yourcast.conf
            supervisorctl reread
            supervisorctl update

            cd /home/yourcast
            supervisorctl restart yourcast
